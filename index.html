<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영생의 다리">
<title>하나님의 선물 영생 — 다리 예화</title>
<link rel="manifest" id="mf">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#FBF7EF; --ink:#262626; --sub:#5b5b5b; --line:#e7dfcf;
  --blue:#1F3A5F; --gold:#C9A227; --red:#B23A3A; --green:#2E7D5B;
  --card:#ffffff; --fs:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14213a}
body{font-family:Pretendard,"PingFang SC","Noto Sans SC","Microsoft YaHei",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);font-size:var(--fs);line-height:1.7;word-break:keep-all;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}

/* header */
header{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#14213a;color:#fff}
header .ttl{flex:1;min-width:0;font-weight:700;font-size:15px;letter-spacing:-.01em}
#hTitle{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body[data-lang=en] #deepTxt text{font-size:15px}
header .ttl small{display:block;font-weight:400;font-size:11.5px;opacity:.7}
.hb{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;min-width:38px;height:38px;font-size:15px;font-family:inherit;padding:0 7px}
.hb.on{background:var(--gold);color:#14213a;font-weight:700}

/* stage */
#stage{position:relative;flex:0 0 auto;height:min(44vh,340px);overflow:hidden}
.sky{position:absolute;inset:0;transition:opacity 1.4s ease}
#skyDay{background:linear-gradient(#8fc3ea,#e9f3fb 70%)}
#skyNight{background:linear-gradient(#0b1020,#2a2f4a 75%);opacity:0}
#skyDawn{background:linear-gradient(#f7d58b,#fff3d6 55%,#fde9c4);opacity:0}
.night #skyNight{opacity:1}
.dawn #skyDawn{opacity:1}
#stage svg{position:absolute;inset:0;width:100%;height:100%}
.tr{transition:transform 1.6s cubic-bezier(.6,0,.3,1),opacity 1.2s}
#L{transform:translateX(0)} #R{transform:translateX(0)}
.joined #L{transform:translateX(50px)} .joined #R{transform:translateX(-50px)}
#filler{opacity:0} .joined #filler{opacity:1}
#bond{opacity:0;transition:opacity 1s} .joined #bond,.crossed #bond2{opacity:1}
#bond2{opacity:0;transition:opacity 1.2s .3s}
#sinTxt{opacity:0;transition:opacity 1s .8s}
.split #sinTxt{opacity:1}
#deepTxt{opacity:0;transition:opacity 1s .4s}
.deep #deepTxt{opacity:1}
#crossG{transform:translateY(-460px);opacity:0;transition:transform 1.3s cubic-bezier(.3,1.35,.5,1),opacity .2s}
.cross #crossG{transform:translateY(0);opacity:1}
.night #P circle:not(#halo),.night #P path{fill:#f2f2f2;stroke:#f2f2f2}
.cross #sinTxt{opacity:.45}
#crossGlow{opacity:0;transition:opacity 1.2s 1s}
.cross #crossGlow{opacity:1}
#giftG{opacity:0;transform:scale(.3);transform-origin:365px 140px;transition:all .8s cubic-bezier(.3,1.5,.5,1)}
.gift #giftG{opacity:1;transform:scale(1)}
#lid{transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.giftOpen #lid{transform:translate(14px,-26px) rotate(28deg)}
#lifeTxt{opacity:0;transform:translateY(8px);transition:all .8s .3s}
.giftOpen #lifeTxt{opacity:1;transform:translateY(-6px)}
#halo{opacity:0;transition:opacity 1s}
#riseG{opacity:0;transform:scale(.2);transform-origin:200px 118px;transition:transform 1.8s cubic-bezier(.2,1.2,.4,1),opacity 1.2s}
.risen #riseG{opacity:1;transform:scale(1)}
.risen #crossG text{opacity:0}
details.faq{background:#fff;border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}
details.faq summary{padding:12px 14px;font-weight:700;color:var(--blue);list-style:none;cursor:pointer;font-size:.95em}
details.faq summary::-webkit-details-marker{display:none}
details.faq[open] summary{background:#eef3f9}
details.faq div{padding:10px 14px 14px;font-size:.92em;line-height:1.75}
.together .solo{display:none}
body[data-lang=zh]{word-break:normal;line-break:strict}
#panel{overflow-x:hidden}
#panel *{overflow-wrap:anywhere}
#langPop{position:absolute;right:10px;top:56px;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:6px;display:none;z-index:25}
#langPop.open{display:block}
#langPop button{display:block;width:150px;text-align:left;border:0;background:none;font-family:inherit;font-size:17px;padding:12px 14px;border-radius:10px}
#langPop button.on{background:#eef3f9;color:var(--blue);font-weight:800}
.langRow{display:flex;gap:8px;margin:14px 0 4px}
.langRow button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;min-height:44px;font-family:inherit;font-size:.9em;color:var(--blue);font-weight:700}
body[data-lang=ko] .langRow button:first-child,body[data-lang=en] .langRow button:nth-child(2),body[data-lang=zh] .langRow button:nth-child(3){background:var(--blue);color:#fff}
textarea.inp{resize:vertical;font-size:.95em}
#svg .lbl{paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2.5px}
#tJesus,#tRisen,#lifeTxt{stroke:rgba(255,255,255,.7)!important}
.crossed #halo{opacity:1}
#rays{opacity:.6;transform-origin:330px 92px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .7s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#bolt{opacity:0}
.boltOn #bolt{animation:bolt 1s}
@keyframes bolt{0%{opacity:0}15%{opacity:1}30%{opacity:.2}45%{opacity:1}100%{opacity:0}}
.plank{transform-box:view-box;transform-origin:150px 150px}
.plank.go{animation:plank 2.4s forwards}
@keyframes plank{0%{transform:scaleX(0);opacity:1}35%{transform:scaleX(1);opacity:1}55%{transform:scaleX(1) rotate(0)}85%{transform:scaleX(1) rotate(65deg);opacity:1}100%{transform:scaleX(1) rotate(80deg) translateY(30px);opacity:0}}
.lbl{font-family:Pretendard,sans-serif;font-weight:700}
#stageCap{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:92%;text-align:center;color:#fff;font-size:15px;font-weight:700;background:rgba(20,33,58,.6);padding:4px 14px;border-radius:20px;pointer-events:none;white-space:nowrap}
#stageCap:empty{display:none}

/* content */
#panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px}
.stepNo{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.05em}
h2{margin:2px 0 8px;font-size:1.35em;line-height:1.35;color:var(--blue);letter-spacing:-.02em}
p{margin:.4em 0 .8em}
.verse{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.verse .ref{font-size:.8em;font-weight:700;color:var(--blue);margin-bottom:2px}
.verse .tx{font-size:1em;line-height:1.75}
.verse b{background:linear-gradient(transparent 58%,#f6e4a6 58%);font-weight:700}
.verse.red{border-left-color:var(--red)} .verse.red b{background:linear-gradient(transparent 58%,#f3c9c9 58%)}
.verse.green{border-left-color:var(--green)} .verse.green b{background:linear-gradient(transparent 58%,#cde9da 58%)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{flex:1 1 auto;min-height:50px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:.95em;font-weight:700;font-family:inherit;padding:10px 14px}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn.gold{background:var(--gold);color:#14213a}
.btn.small{min-height:40px;font-size:.82em;flex:0 0 auto}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45}
.bubble{background:#eef3f9;border-radius:16px 16px 16px 4px;padding:12px 14px;margin:10px 0;color:#1d2f48}
.bubble.me{background:#fff4d6;border-radius:16px 16px 4px 16px;margin-left:30px}
.fade{animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.note{display:none;background:#1f2a3d;color:#e9eef6;border-radius:12px;padding:12px 14px;margin:14px 0;font-size:.85em;line-height:1.65}
.note h4{margin:0 0 4px;color:var(--gold);font-size:.95em}
.showNotes .note{display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.cmp div{border-radius:12px;padding:10px 12px;font-size:.88em;line-height:1.55}
.cmp .a{background:#f7e3e3} .cmp .b{background:#e2f2e9}
.cmp strong{display:block;font-size:1.05em;margin-bottom:2px}
.blank{display:inline-block;min-width:70px;text-align:center;border-bottom:2px solid var(--blue);color:transparent;cursor:pointer;padding:0 4px;border-radius:4px;background:#eef3f9;transition:all .3s}
.blank.open{color:var(--green);font-weight:800;background:#e2f2e9;border-color:var(--green)}
.prayer{background:#fff;border:2px dashed var(--gold);border-radius:14px;padding:14px 16px;font-size:1.02em;line-height:1.95}
.train{display:flex;gap:6px;align-items:stretch;margin:10px 0}
.train div{flex:1;border-radius:10px;padding:8px 4px;text-align:center;font-size:.8em;line-height:1.35;color:#fff}
.card{background:linear-gradient(135deg,#1F3A5F,#2c5282);color:#fff;border-radius:18px;padding:18px;text-align:center;margin:12px 0}
.card .big{font-size:1.35em;font-weight:800;color:#f7d58b}
input.inp{width:100%;font-size:1em;font-family:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;margin:6px 0}

/* nav */
nav{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
nav .nb{min-width:84px;height:50px;border-radius:14px;border:0;font-size:16px;font-weight:700;font-family:inherit}
#prev{background:#eef0f4;color:var(--blue)} #next{background:var(--blue);color:#fff}
#dots{flex:1;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
#dots i{width:8px;height:8px;border-radius:50%;background:#d6d0c4}
#dots i.on{background:var(--gold);width:20px;border-radius:5px}

/* toc */
#toc{position:absolute;inset:0;background:rgba(10,16,30,.55);display:none;z-index:20}
#toc.open{display:block}
#toc .sheet{position:absolute;right:0;top:0;bottom:0;width:82%;max-width:380px;background:#fff;padding:16px;overflow:auto;padding-top:max(16px,env(safe-area-inset-top))}
#toc button{display:block;width:100%;text-align:left;border:0;background:none;font-family:inherit;font-size:16px;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink)}
#toc button.cur{color:var(--blue);font-weight:800}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:rgba(20,33,58,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="ttl"><span id="hTitle">하나님의 선물 · 영생</span><small id="hSub">다리 예화로 보는 복음</small></div>
    <button class="hb" id="langBtn" title="Language">🌐</button><button class="hb" id="spkBtn">🔊</button><button class="hb" id="modeBtn">🙋</button>
    <button class="hb" id="noteBtn" title="전하는 이 노트">📝</button>
    <button class="hb" id="tocBtn" title="목차">☰</button>
  </header>

  <div id="stage" class="joined">
    <div class="sky" id="skyDay"></div><div class="sky" id="skyNight"></div><div class="sky" id="skyDawn"></div>
    <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMax meet" id="svg">
      <defs>
        <radialGradient id="sun"><stop offset="0" stop-color="#fffbe8"/><stop offset=".45" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffd25a" stop-opacity="0"/></radialGradient>
        <linearGradient id="abyss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1b1b"/><stop offset="1" stop-color="#050505"/></linearGradient>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a4a22"/><stop offset=".5" stop-color="#a8682f"/><stop offset="1" stop-color="#7a4a22"/></linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#fff2b8" stop-opacity=".9"/><stop offset="1" stop-color="#fff2b8" stop-opacity="0"/></radialGradient>
        <linearGradient id="earthL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a6650"/><stop offset="1" stop-color="#4a3c2f"/></linearGradient>
      </defs>

      <!-- chasm -->
      <rect x="120" y="150" width="160" height="95" fill="url(#abyss)"/>
      <text id="sinTxt" class="lbl" x="200" y="199" text-anchor="middle" font-size="34" fill="#ff6b6b"><tspan id="tSin">죄</tspan></text>
      

      <!-- effort planks -->
      <g id="planks"></g>

      <!-- cliffs -->
      <g id="L" class="tr">
        <path d="M-60 150 L150 150 L141 172 L151 196 L136 240 L-60 240 Z" fill="url(#earthL)"/>
        <path d="M-60 150 L150 150" stroke="#6aa84f" stroke-width="5"/>
        <text id="tMan" class="lbl" x="70" y="192" text-anchor="middle" font-size="21" fill="#fff">사람</text>
      </g>
      <g id="R" class="tr">
        <path d="M250 150 L460 150 L460 240 L264 240 L250 212 L262 182 Z" fill="url(#earthL)"/>
        <path d="M250 150 L460 150" stroke="#6aa84f" stroke-width="5"/>
        <text id="tGod" class="lbl" x="330" y="192" text-anchor="middle" font-size="21" fill="#fff">하나님</text>
      </g>
      <rect id="filler" class="tr" x="170" y="147.5" width="60" height="93" fill="url(#earthL)"/>
      <rect id="fillerG" x="170" y="147.5" width="60" height="5" fill="#6aa84f" style="opacity:var(--fg,1);transition:opacity 1s"/>

      <g id="deepTxt"><text id="tDeath" class="lbl" x="188" y="232" text-anchor="end" font-size="17" fill="#ffadad">사망</text><text id="tJudg" class="lbl" x="212" y="232" text-anchor="start" font-size="17" fill="#ffadad">심판</text></g>
      <!-- crack bolt -->
      <path id="bolt" d="M200 60 L188 100 L206 108 L192 150 L210 160 L196 238" stroke="#ff4d4d" stroke-width="4" fill="none"/>

      <g id="riseG">
        <circle cx="200" cy="118" r="120" fill="url(#glow)"/>
        <g stroke="#fff6c8" stroke-width="3" stroke-linecap="round" opacity=".9">
          <line x1="200" y1="40" x2="200" y2="10"/><line x1="150" y1="60" x2="128" y2="38"/><line x1="250" y1="60" x2="272" y2="38"/>
          <line x1="122" y1="105" x2="92" y2="98"/><line x1="278" y1="105" x2="308" y2="98"/></g>
        <text id="tRisen" class="lbl" x="200" y="84" text-anchor="middle" font-size="17" fill="#8a5a00">부활하신 예수님</text>
      </g>
      <!-- cross -->
      <g id="crossG">
        <ellipse id="crossGlow" cx="200" cy="140" rx="90" ry="70" fill="url(#glow)"/>
        <rect x="193" y="92" width="14" height="150" rx="2" fill="url(#wood)"/>
        <rect x="134" y="146" width="132" height="12" rx="2" fill="url(#wood)"/>
        <text id="tJesus" class="lbl" x="200" y="84" text-anchor="middle" font-size="16" fill="#6a3510">예수 그리스도</text>
      </g>

      <!-- bonds -->
      <path id="bond" d="M95 108 Q210 20 320 140" stroke="#e0a800" stroke-width="2.5" fill="none" stroke-dasharray="5 5"/>
      <path id="bond2" d="M305 120 Q315 100 312 98" stroke="#e0a800" stroke-width="0" fill="none"/>

      <!-- gift -->
      <g id="giftG">
        <text id="lifeTxt" class="lbl" x="352" y="110" text-anchor="middle" font-size="19" fill="#9a6a00">영생</text>
        <rect x="352" y="128" width="26" height="20" fill="#c0392b" rx="2"/>
        <rect x="363" y="128" width="4" height="20" fill="#f1c40f"/>
        <g id="lid"><rect x="349" y="121" width="32" height="8" fill="#e74c3c" rx="2"/><rect x="363" y="121" width="4" height="8" fill="#f1c40f"/>
          <path d="M365 121 q-8 -9 -12 -2 q4 4 12 2 q8 -9 12 -2 q-4 4 -12 2" fill="#f1c40f"/></g>
      </g>

      <!-- person -->
      <g id="P" transform="translate(85 0)">
        <circle id="halo" cx="0" cy="118" r="20" fill="url(#glow)"/>
        <circle cx="0" cy="113" r="6" fill="#2b2b2b"/>
        <path d="M0 119 L0 136 M0 124 L-8 131 M0 124 L8 131 M0 136 L-6 148 M0 136 L6 148" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" fill="none"/>
      </g>
    </svg>
    <div id="stageCap"></div>
  </div>

  <div id="panel"></div>

  <nav>
    <button class="nb" id="prev">◀ 이전</button>
    <div id="dots"></div>
    <button class="nb" id="next">다음 ▶</button>
  </nav>

  <div id="toc"><div class="sheet"><div id="tocH" style="font-weight:800;color:var(--blue);margin-bottom:6px">목차</div><div id="tocList"></div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:14px"><span id="fsLbl" style="flex:1;font-weight:700">글자 크기</span><button class="btn small ghost" style="min-width:56px" onclick="fsStep(-1)">가−</button><button class="btn small ghost" style="min-width:56px" onclick="fsStep(1)">가+</button></div>
    <div id="tocHelp" style="font-size:13px;color:#888;margin-top:14px;line-height:1.6"></div></div></div>
  <div id="langPop"><button data-l="ko" onclick="setLang('ko',1)">한국어</button><button data-l="en" onclick="setLang('en',1)">English</button><button data-l="zh" onclick="setLang('zh',1)">中文</button></div>
  <div id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const stage=$('#stage'), panel=$('#panel');
let cur=0, prayed=false, personX=85, steps=[], L;
const LS='bridge_v1';
const st=JSON.parse(localStorage.getItem(LS)||'{}');
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}};
if(st.fs) document.documentElement.style.setProperty('--fs',st.fs+'px');

function V(ref,tx,cls=''){return `<div class="verse ${cls}"><div class="ref">${ref}</div><div class="tx">${tx}</div></div>`}
function N(t){return `<div class="note"><h4>📝</h4>${t}</div>`}
function Q(q,a){return `<details class="faq"><summary>❓ ${q}</summary><div>${a}</div></details>`}
function B(w){return `<span class="blank" onclick="openB(this)">${w}</span>`}
function TRAIN(a,a2,b,b2,c,c2){return `<div class="train"><div style="background:#1F3A5F">🚂<br><b>${a}</b><br>${a2}</div><div style="background:#2E7D5B">🚃<br><b>${b}</b><br>${b2}</div><div style="background:#9a8a6a">🚃<br><b>${c}</b><br>${c2}</div></div>`}
function BDAY(h,ph,btn){return `<h2 style="font-size:1.1em;margin-top:16px">${h}</h2><input class="inp" id="bdName" placeholder="${ph}"><input class="inp" id="bdDate" type="date"><div class="btns"><button class="btn gold" onclick="makeCard()">${btn}</button></div><div id="cardBox"></div>`}

/* ===== 언어별 화면 문구 ===== */
const UI={
ko:{title:'하나님의 선물 · 영생',sub:'다리 예화로 보는 복음',prev:'◀ 이전',next:'다음 ▶',restart:'처음 ↺',toc:'목차',
 tocHelp:'📝 전하는 이 노트 켜기/끄기 · 🔊 읽어 주기 · 👥/🙋 함께 보기/혼자 보기<br>그림을 누르면 움직임이 다시 재생됩니다. 좌우로 밀어서 넘길 수도 있습니다.',

const TESTI={
ko:`저는 예수님을 믿는 집안에서 태어나, 어려서부터 착한 모범생이라는 칭찬을 들으며 자랐습니다. 그래서 저는 하나님 앞에서도 당연히 괜찮은 사람이라고 생각했습니다.

대학에 들어가 네비게이토의 한 형제가 이 다리 그림으로 복음을 전해 주었습니다. "의인은 없나니 하나도 없으며"(롬 3:10), "우리는 다 양 같아서 그릇 행하여 각기 제 길로 갔거늘"(사 53:6). 이 말씀 앞에서 저도 하나님을 떠나 제 길로 가던 죄인이라는 것을 처음으로 깨달았습니다. 착하게 사는 것이 저를 하나님께 데려다주는 다리가 아니었습니다.

1983년 12월 30일, 한양대 전철역에서 저는 예수님을 저의 구주로 영접했습니다. 그날 이후 지금까지 예수님은 제 삶의 중심이십니다.

이것은 제 한 사람의 이야기이고, 당신의 경험은 저와 다를 수 있습니다. 그러나 같은 다리가 지금 당신 앞에도 놓여 있습니다.`,
en:`I was born into a Christian family, and from childhood I was praised as a good, model student. So I assumed that I was naturally fine before God as well.

When I entered university, a brother from The Navigators shared the gospel with me using this bridge illustration. "There is no one righteous, not even one" (Romans 3:10). "We all, like sheep, have gone astray, each of us has turned to our own way" (Isaiah 53:6). Through these words I realized for the first time that I, too, was a sinner who had left God and gone my own way. Being good was not the bridge that could bring me to God.

On December 30, 1983, at Hanyang University subway station, I received Jesus as my Savior. From that day until now, Jesus has been the center of my life.

This is just one person's story, and your experience may be different from mine. But the same bridge is now set before you.`,
zh:`我出生在一个信耶稣的家庭，从小就被称赞是个乖巧的模范学生。所以我理所当然地以为，自己在神面前也是个不错的人。

上大学后，导航会的一位弟兄用这幅"桥"的图画向我传福音。"没有义人，连一个也没有"（罗马书 3:10），"我们都如羊走迷，各人偏行己路"（以赛亚书 53:6）。在这些经文面前，我第一次认识到，我也是一个离开神、偏行己路的罪人。做个好人，并不是能把我带到神面前的那座桥。

1983年12月30日，在汉阳大学地铁站，我接待耶稣作我的救主。从那天到现在，耶稣一直是我生命的中心。

这只是我一个人的故事，你的经历可能和我不同。但是，同一座桥现在也摆在你的面前。`};

${Q('하나님이 정말 계신지 모르겠어요.','괜찮습니다. 이 앱은 믿으라고 강요하지 않습니다. 성경이 하나님과 사람에 대해 무엇이라고 말하는지 끝까지 들어 보시고, 그다음에 스스로 판단해 보세요. 질문은 언제나 환영입니다.')}
${N('· 요 3:16의 "세상" 자리에 듣는 분의 이름을 넣어 읽어 보게 하세요.<br>· 질문: "하나님이 나를 사랑하신다는 말을 들으면 어떤 마음이 드세요?"<br>· 그런데 왜 많은 사람이 이 사랑을 누리지 못할까요? → 다음')}`},
sin:{t:'우리의 현실 — 죄',cap:'죄가 하나님과 사람 사이를 갈라 놓았습니다',html:`
<div class="stepNo">2 · 우리의 현실</div>
<h2>죄가 하나님과 사람 사이를<br>갈라 놓았습니다</h2>
<p class="solo">성경에서 죄는 나쁜 행동만을 뜻하지 않습니다. <b>하나님을 신뢰하지 않고, 그분 없이 내가 내 삶의 주인이 되어 살아가려는 마음</b>과 그로부터 나오는 행동을 포함합니다.</p>
<div class="btns"><button class="btn small ghost" onclick="replayCrack()">▶ 다시 보기</button></div>
${V('로마서 3:23','<b>모든 사람이 죄를 범하였으매</b> 하나님의 영광에 이르지 못하더니','red')}
${V('이사야 53:6','우리는 다 양 같아서 그릇 행하여 <b>각기 제 길로 갔거늘</b> 여호와께서는 우리 모두의 죄악을 그에게 담당시키셨도다','red')}
${V('이사야 59:2','오직 너희 죄악이 <b>너희와 너희 하나님 사이를 갈라 놓았고</b> 너희 죄가 그의 얼굴을 가리어서 너희에게서 듣지 않으시게 함이니라','red')}
${Q('저는 착하게 살려고 하는데도 죄인인가요?','성경이 말하는 죄는 범죄의 크기가 아니라 <b>방향</b>의 문제입니다. 착하게 살아도 하나님 없이 내가 주인이 되어 "제 길로" 간다면 하나님과의 관계는 끊어진 상태입니다. 활을 쏠 때 1cm 빗나가도, 1m 빗나가도 과녁을 맞히지 못한 것은 같습니다. 성경의 "죄"라는 말에는 바로 이 "과녁을 빗나감"이라는 뜻이 있습니다.')}
${N('· 롬 3:23의 "모든 사람"에 나도 포함되는지 물어보세요: "여기에 ○○님도 포함될까요? 저도 포함됩니다."<br>· 사 53:6은 전하는 이가 직접 깨달은 말씀이라면 그 경험을 짧게 나누세요.<br>· 정죄하는 말투보다 "저도 그랬습니다"라는 말투로.')}`},
death:{t:'죄의 결과',cap:'죄의 삯은 사망, 그 후에는 심판',html:`
<div class="stepNo">3 · 죄의 결과</div>
<h2>죄의 결과는 사망과 심판입니다</h2>
<p class="solo">성경은 죄의 값(삯)이 <b>사망</b>이라고 말합니다. 육체의 죽음만이 아니라 생명의 근원이신 하나님과 영원히 분리되는 것입니다.</p>
${V('로마서 6:23 (앞)','<b>죄의 삯은 사망이요</b>','red')}
${V('히브리서 9:27','한 번 죽는 것은 사람에게 정해진 것이요 <b>그 후에는 심판이 있으리니</b>','red')}
${Q('하나님이 사랑이시라면서 왜 심판하시나요?','사랑과 공의는 서로 반대가 아닙니다. 불의를 그냥 덮는 재판관은 좋은 재판관이 아닙니다. 하나님은 거룩하시기에 죄를 심판하시고, 동시에 사랑하시기에 그 심판을 대신 받을 길을 준비하셨습니다. 그 이야기가 곧 이어집니다.')}
${N('· 질문: "삯"이 무엇일까요? → 일한 대가로 받는 품삯.<br>· 겁을 주기보다 사실을 담담히 전하세요.<br>· "사람들은 이 골짜기를 어떻게 건너려고 할까요?" → 다음')}`},
effort:{t:'우리의 한계',cap:'어떤 노력도 하나님께 닿지 못합니다',html:`
<div class="stepNo">4 · 우리의 한계</div>
<h2>우리의 노력으로는<br>건널 수 없습니다</h2>
<p>사람들은 이 골짜기를 건너려고 여러 가지 다리를 놓습니다. 단추를 눌러 <b>직접 건너가 보세요.</b></p>
<div class="btns">
 <button class="btn ghost" onclick="tryPlank(this,'선행',78)">🤲 선행</button>
 <button class="btn ghost" onclick="tryPlank(this,'종교',66)">🙏 종교</button>
 <button class="btn ghost" onclick="tryPlank(this,'도덕',72)">⚖️ 도덕</button>
 <button class="btn ghost" onclick="tryPlank(this,'철학',60)">📚 철학</button>
 <button class="btn ghost" onclick="tryPlank(this,'성공',54)">💰 성공</button>
</div>
<div id="effortMsg"></div>
${Q('그러면 선하게 사는 일은 의미가 없다는 뜻인가요?','아닙니다. 선하게 사는 것은 귀하고 하나님도 기뻐하십니다. 다만 선행으로 <b>구원을 사는 것은 아니라는</b> 뜻입니다. 순서가 반대입니다. 선행으로 하나님께 가는 것이 아니라, 하나님의 은혜로 구원받은 사람이 감사함으로 선을 행하며 살게 됩니다(엡 2:10).')}
${N('· 듣는 분이 직접 눌러 보게 하세요. 떨어질 때마다 "이것으로는 될까요?"<br>· 질문: "○○님은 무엇으로 이 간격을 건너려고 하셨나요?"<br>· 선행이 나쁘다는 인상을 주지 않도록 위 질문을 꼭 함께 다루세요.')}`},
cross:{t:'예수님의 십자가',cap:'하나님이 먼저 길을 여셨습니다',html:`
<div class="stepNo">5 · 예수님의 십자가</div>
<h2>하나님이 먼저<br>구원의 길을 여셨습니다</h2>
<p class="solo">사람이 하나님께 갈 수 없기에 <b>하나님이 사람에게 오셨습니다.</b> 예수님은 우리가 받아야 할 죄의 값을 대신 지고 십자가에서 죽으셨습니다.</p>
<div class="btns"><button class="btn small ghost" onclick="replayCross()">▶ 다시 보기</button></div>
${V('로마서 5:8','우리가 <b>아직 죄인 되었을 때에</b> 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라','green')}
${V('베드로전서 3:18','그리스도께서도 단번에 죄를 위하여 죽으사 <b>의인으로서 불의한 자를 대신하셨으니</b> 이는 우리를 하나님 앞으로 인도하려 하심이라','green')}
${Q('왜 예수님이 죽으셔야 했나요?','죄의 삯은 사망이기에 누군가는 그 값을 치러야 했습니다. 죄 없으신 예수님만이 남의 죄를 대신 질 수 있었습니다. 십자가는 하나님의 공의(죄는 반드시 값을 치름)와 사랑(그 값을 하나님이 스스로 치르심)이 함께 드러난 자리입니다.')}
${N('· "대신(代身)"을 강조하세요: 내가 받을 사망을 예수님이 대신 받으셨습니다.<br>· 롬 5:8 — 우리가 착해진 다음이 아니라 "아직 죄인 되었을 때".')}`},
risen:{t:'다시 살아나신 예수님',cap:'예수님은 다시 살아나셨습니다',html:`
<div class="stepNo">6 · 부활</div>
<h2>예수님은 죽으셨고,<br>다시 살아나셨습니다</h2>
<p class="solo">십자가로 이야기가 끝나지 않습니다. 예수님은 사흘 만에 <b>다시 살아나셨습니다.</b> 복음은 과거의 희생을 기억하라는 말에 그치지 않고, <b>지금 살아 계신 예수님을 신뢰하며</b> 새로운 삶을 시작하라는 초대입니다.</p>
<div class="btns"><button class="btn small ghost" onclick="replayRise()">▶ 다시 보기</button></div>
${V('고린도전서 15:3-4','그리스도께서 성경대로 <b>우리 죄를 위하여 죽으시고</b> 장사 지낸 바 되셨다가 성경대로 <b>사흘 만에 다시 살아나사</b>','green')}
${V('요한복음 14:6','예수께서 이르시되 <b>내가 곧 길이요</b> 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라','green')}
${Q('부활이 왜 그렇게 중요한가요?','부활은 예수님의 십자가가 실제로 죄와 죽음을 이겼다는 하나님의 확증입니다. 그리고 우리가 믿는 분이 기념비 속 인물이 아니라 지금 살아서 나와 관계를 맺으실 수 있는 분이라는 뜻입니다. 그래서 믿음은 "사실 인정"을 넘어 "살아 계신 분을 신뢰함"이 됩니다.')}
${N('· 다리는 무너지지 않았습니다 — 부활이 다리를 영원히 붙들고 있습니다.<br>· 고전 15:3-4는 바울이 "가장 먼저 전한 것"이라고 한 복음의 요약입니다.')}`},
gift:{t:'하나님의 선물',cap:'영생은 값없이 주시는 하나님의 선물',html:`
<div class="stepNo">7 · 하나님의 선물</div>
<h2>구원은 보상이 아니라<br>선물입니다</h2>
<p class="solo">선물은 일해서 버는 것이 아니라 <b>값없이 받는 것</b>입니다. 그림의 선물 상자를 열어 보세요.</p>
<div class="btns"><button class="btn gold" onclick="openGift()">🎁 선물 열기</button></div>
${V('로마서 6:23','죄의 삯은 사망이요 <b>하나님의 은사는</b> 그리스도 예수 우리 주 안에 있는 <b>영생</b>이니라','green')}
<div class="cmp"><div class="a"><strong>죄의 삯</strong>내가 일한 대가<br>→ 마땅히 받는 것<br>→ <b>사망</b></div><div class="b"><strong>하나님의 은사</strong>값없이 주시는 선물<br>→ 받기만 하면 됨<br>→ <b>영생</b></div></div>
<div class="bubble"><b>영생이란?</b> 단지 끝없이 오래 사는 것이 아닙니다. <b>하나님을 알고 그분과 함께 살아가는 생명</b>이며, 지금 시작되어 죽음 너머까지 이어지는 관계입니다.</div>
${V('요한복음 17:3','<b>영생은 곧</b> 유일하신 참 하나님과 그가 보내신 자 예수 그리스도를 <b>아는 것이니이다</b>','green')}
${V('에베소서 2:8-9','너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 <b>하나님의 선물이라</b> 행위에서 난 것이 아니니 이는 누구든지 자랑하지 못하게 함이라','green')}
${Q('공짜라면 너무 쉬운 것 아닌가요?','받는 사람에게는 값없지만, 주시는 하나님께는 가장 비싼 값—아들의 생명—이 치러진 선물입니다. 쉬워서가 아니라, 우리가 결코 갚을 수 없기에 선물로 주신 것입니다.')}
${N('· 실제로 볼펜 같은 물건을 내밀며 "선물입니다" 해 보세요. 받으려면? → 손을 내밀어 받기만. 돈을 내면 더 이상 선물이 아닙니다.<br>· 롬 6:23 한 구절 전도: "죄", "선물", "영생"이라는 말을 각각 어떻게 생각하는지 물어보세요.')}`},
story:{t:'저의 이야기',cap:'저도 이 그림으로 예수님을 만났습니다',html:`
<div class="stepNo">전하는 이의 이야기</div>
<h2>저도 이 이야기를 듣고<br>예수님을 믿게 되었습니다</h2>
<div id="testi"></div>
${N('· 전하는 분은 ✏️ 단추로 자신의 간증을 넣을 수 있습니다: ① 예전에 하나님을 어떻게 생각했는지 ② 다리 예화에서 무엇을 깨달았는지 ③ 예수님을 믿는 것이 지금 내게 어떤 의미인지.<br>· "저처럼 느껴야 믿은 것"이라는 인상을 주지 않도록.')}`},
respond:{t:'나의 응답',cap:'당신은 지금 어느 편에 계십니까?',html:`
<div class="stepNo">8 · 나의 응답</div>
<h2>다리가 놓였습니다.<br>이제 건너가는 일이 남았습니다</h2>
<p class="solo">예수님을 믿는다는 것은 이렇게 말할 수 있습니다.</p>
<div class="cmp"><div class="a" style="background:#f3ece0"><strong>🔄 회개</strong>내가 주인 되어 가던 길에서 돌아서는 것</div><div class="b"><strong>🤝 믿음</strong>살아 계신 예수님께 나를 맡기는 것</div></div>
${V('요한복음 1:12','<b>영접하는 자</b> 곧 그 이름을 믿는 자들에게는 <b>하나님의 자녀가 되는 권세</b>를 주셨으니','green')}
${V('요한계시록 3:20','볼지어다 내가 <b>문 밖에 서서 두드리노니</b> 누구든지 내 음성을 듣고 <b>문을 열면</b> 내가 그에게로 들어가 그와 더불어 먹고 그는 나와 더불어 먹으리라','green')}
${Q('믿는다는 것은 사실이라고 인정하는 것인가요?','인정하는 것에서 시작하지만 거기서 멈추지 않습니다. 의자가 튼튼하다는 것을 아는 것만으로는 쉴 수 없고, 실제로 앉아 몸을 맡겨야 합니다. 믿음은 예수님이 나를 위해 죽고 살아나셨다는 사실 위에 <b>나 자신을 맡기는 것</b>입니다.')}
<div class="bubble">그림 속에서 당신은 지금 어디에 계신가요? 마음에 가까운 것을 골라 보세요.</div>
<div class="btns" style="flex-direction:column">
 <button class="btn gold" onclick="go(idx('pray'),1)">🙏 하나님께 기도하고 싶어요</button>
 <button class="btn ghost" onclick="moreFaith()">📖 예수님을 믿는다는 뜻을 더 알고 싶어요</button>
 <button class="btn ghost" onclick="go(idx('faq'),1)">❓ 아직 질문이 있어요</button>
 <button class="btn ghost" onclick="pause()">🌙 오늘은 여기까지 살펴볼게요</button>
 <button class="btn ghost" style="border-style:dashed" onclick="go(idx('assure'),1)">😊 이미 예수님을 믿고 있어요</button>
</div>
<div id="whereBox"></div>
${N('· 그림의 사람을 가리키며 물어보세요. 강요하지 말고 기다려 주세요. 침묵도 괜찮습니다.<br>· 어떤 선택이든 존중하고, 다시 만날 약속이나 연락처를 남기세요.')}`},
pray:{t:'기도',cap:'믿음으로 다리를 건너갑니다',html:`
<div class="stepNo">9 · 기도</div>
<h2>마음을 하나님께<br>말씀드려 보세요</h2>
<p style="font-size:.88em;color:var(--sub)">이 문장을 그대로 읽는 행위 자체가 구원을 주는 것은 아닙니다. 중요한 것은 예수님을 신뢰하며 하나님께 진실하게 나아가는 것입니다. 아래 기도는 마음을 표현하도록 돕는 <b>예시</b>입니다.</p>
<div class="prayer">하나님,<br>저는 하나님을 떠나 제 뜻대로 살아온 죄인입니다. 용서해 주세요.<br>예수님께서 저의 죄를 위해 십자가에서 죽으시고 다시 살아나신 것을 믿습니다.<br>이제 제 길에서 돌아서서, 예수님을 저의 <b>구주와 주님으로 영접</b>합니다.<br>영생을 선물로 주셔서 감사합니다.<br>예수님의 이름으로 기도합니다. <b>아멘.</b></div>
<div class="btns"><button class="btn gold" id="amenBtn" onclick="amen()">🙏 진심으로 이 기도를 드렸습니다</button></div>
<div id="amenBox"></div>
${Q('회개하면 완벽한 사람이 되어야 하나요?','아닙니다. 회개는 완벽해지겠다는 약속이 아니라 <b>방향을 바꾸는 것</b>입니다. 넘어질 때도 있지만, 하나님의 자녀는 다시 하나님께 돌아와 용서받고 자라 갑니다(요일 1:9).')}
${N('· 전하는 이가 한 구절씩 먼저 읽고 따라 하게 하면 좋습니다.<br>· 기도 후 바로 확신의 말씀으로 넘어가세요. 감정이 아니라 약속에 근거합니다.')}`},
assure:{t:'확신',cap:'사망에서 생명으로 옮겼습니다',html:`
<div class="stepNo">10 · 확신</div>
<h2>영생은 지금 이미<br>내 것입니다</h2>
<p>빈칸을 눌러 하나님의 약속을 확인해 보세요.</p>
<div class="verse green"><div class="ref">요한복음 5:24</div><div class="tx">내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 ${B('얻었고')} 심판에 ${B('이르지 아니하나니')} 사망에서 생명으로 ${B('옮겼느니라')}</div></div>
<div id="blankMsg"></div>
${V('요한일서 5:11-13','또 증거는 이것이니 하나님이 우리에게 영생을 주신 것과 이 생명이 그의 아들 안에 있는 그것이니라 <b>아들이 있는 자에게는 생명이 있고</b> 하나님의 아들이 없는 자에게는 생명이 없느니라 내가 하나님의 아들의 이름을 믿는 너희에게 이것을 쓰는 것은 너희로 하여금 <b>너희에게 영생이 있음을 알게</b> 하려 함이라','green')}
<p class="solo" style="font-size:.9em;color:var(--sub)">확신은 기분이 아니라 <b>하나님의 말씀</b> 위에 서 있습니다.</p>
${TRAIN('사실','하나님의 말씀','믿음','말씀을 신뢰','감정','따라오는 것')}
${Q('아직 확신이 없어도 괜찮을까요?','괜찮습니다. 확신은 하루아침에 완성되지 않고 말씀을 읽으며 자랍니다. 질문이 남아 있다면 언제든 묻고, 요한복음을 하루 한 장씩 읽어 보세요. 하나님은 정직하게 찾는 사람을 만나 주십니다.')}
${N('· 시제에 주목: "얻을 것이다"가 아니라 "얻었고", "옮겼느니라" — 이미 이루어진 사실.<br>· 기차 예화: 기관차(사실)가 끌고 석탄차(믿음)가 연료를 대고 객차(감정)는 따라옵니다.')}`},
next:{t:'그다음 걸음',cap:'하나님 편에서 시작되는 새 삶',html:`
<div class="stepNo">11 · 그다음</div>
<h2>새 생명이 자라가려면</h2>
<p class="solo">갓 태어난 아기가 먹고 숨 쉬고 가족 안에서 자라듯, 그리스도인도 <b>네 가지</b>로 자라갑니다.</p>
${WHEEL('말씀','기도','교제','증거','그리스도','중심','순종하는 그리스도인의 삶')}
<p style="font-size:.9em">📖 <b>말씀</b> — 요한복음을 하루 한 장씩<br>🙏 <b>기도</b> — 하나님께 무엇이든 말씀드리기<br>🤝 <b>교제</b> — 이 복음을 전해 준 사람, 교회와 함께<br>📣 <b>증거</b> — 받은 선물을 다른 이에게</p>
${BDAY('🎂 나의 영적 생일','이름','영적 생일 카드 만들기')}
${N('· 수레바퀴: 힘은 중심(그리스도)에서 나옵니다. 세로 살(말씀·기도)은 하나님과, 가로 살(교제·증거)은 사람과의 관계.<br>· 일주일 안에 다시 만날 약속을 정하고, 요한복음을 함께 읽으며 양육을 시작하세요.')}`},
summary:{t:'한눈에 보기',cap:'하나님의 선물 영생 — 다리 예화',html:`
<div class="stepNo">정리</div>
<h2>한눈에 보는 복음</h2>
<div class="verse"><div class="tx" style="font-size:.95em;line-height:1.9">
① <b>하나님의 뜻</b> — 요 3:16, 요 10:10<br>② <b>우리의 현실 · 죄</b> — 롬 3:23, 사 53:6, 사 59:2<br>③ <b>죄의 결과</b> — 롬 6:23 앞, 히 9:27<br>④ <b>우리의 한계</b> — 엡 2:8-9<br>⑤ <b>십자가</b> — 롬 5:8, 벧전 3:18<br>⑥ <b>부활</b> — 고전 15:3-4, 요 14:6<br>⑦ <b>선물인 영생</b> — 롬 6:23, 요 17:3<br>⑧ <b>나의 응답</b> — 요 1:12, 계 3:20<br>⑨ <b>확신</b> — 요 5:24, 요일 5:11-13</div></div>
<div class="btns"><button class="btn" onclick="go(0)">처음부터 다시</button><button class="btn ghost" onclick="share()">🔗 이 앱 보내기</button></div>
${N('· 종이에 이 그림을 직접 그리며 다시 설명하고, 그 종이를 선물로 드리세요.<br>· 이해 확인 질문: "인간의 문제는 무엇이라고 했나요?" "예수님은 무엇을 하셨다고 이해하셨나요?" "믿는다는 것은 무엇이라고 느끼셨나요?" "이해되지 않는 표현은 어디였나요?"')}`},
faq:{t:'자주 묻는 질문',cap:'궁금한 것은 언제든 물어보세요',html:`
<div class="stepNo">질문</div>
<h2>아직 질문이 있으신가요?</h2>
<p>질문하는 것은 믿음의 반대가 아닙니다. 궁금한 질문을 눌러 보세요.</p>
<div id="faqAll"></div>
<div class="bubble">여기 없는 질문은 이 앱을 전해 준 분께 직접 물어보세요. 기쁘게 함께 이야기할 것입니다.</div>
<div class="btns"><button class="btn ghost" onclick="go(idx('respond'),-1)">◀ 나의 응답으로</button></div>`}
}),

/* ------------------------------ English (NIV) ------------------------------ */
en:()=>({
start:{t:'Start',cap:'',html:`
<div class="stepNo">THE GIFT OF GOD</div>
<h2>Between God and me —<br>what way has Jesus opened?</h2>
<p>Explore the heart of the Christian message through <b>pictures and short explanations</b>. It takes about 10 minutes, and you can stop and ask questions at any time.</p>
<div class="btns" style="flex-direction:column">
 <button class="btn" onclick="setMode('together',true)">👥 Look together<br><span style="font-weight:400;font-size:.8em">with the person sharing it with you</span></button>
 <button class="btn ghost" onclick="setMode('alone',true)">🙋 On my own<br><span style="font-weight:400;font-size:.8em">read and listen at my own pace</span></button>
</div>${LANGBTNS}
${N('· "Together" shows less text and a bigger picture. Keep these notes (📝) on for the helper only.<br>· A question to open the conversation: "If your life ended tonight, are you sure you would go to heaven?" "On what basis?"<br>· Ask permission: "May I show you, with one simple picture, how the Bible answers that question?"')}`},
love:{t:"God's Purpose",cap:'In the beginning, God and people were together',html:`
<div class="stepNo">1 · GOD'S PURPOSE</div>
<h2>God loves us and made us<br>to live with him</h2>
<p class="solo">The Bible says God created people in his own image and wanted them to live in a <b>close relationship</b> with him. As the picture shows, at first there was no gap between God and people.</p>
<p class="solo">So why do we feel far from God, and hurt one another as we live?</p>
${V('John 3:16','For God <b>so loved the world</b> that he gave his one and only Son, that whoever believes in him shall not perish but <b>have eternal life.</b>')}
${V('John 10:10','I have come that they may have life, and have it <b>to the full.</b>')}
${Q('I am not sure God even exists.','That is okay. This app will not force you to believe. Listen to what the Bible says about God and people all the way through, and then judge for yourself. Questions are always welcome.')}
${N('· Have the listener read John 3:16 with their own name in place of "the world".<br>· Ask: "How do you feel when you hear that God loves you?"<br>· So why do so many people not experience this love? → Next')}`},
sin:{t:'Our Problem — Sin',cap:'Sin has separated people from God',html:`
<div class="stepNo">2 · OUR PROBLEM</div>
<h2>Sin has separated us<br>from God</h2>
<p class="solo">In the Bible, sin is not only bad behavior. It is <b>the attitude of not trusting God and living as the master of my own life without him</b> — and the actions that come from it.</p>
<div class="btns"><button class="btn small ghost" onclick="replayCrack()">▶ Replay</button></div>
${V('Romans 3:23','for <b>all have sinned</b> and fall short of the glory of God','red')}
${V('Isaiah 53:6','We all, like sheep, have gone astray, <b>each of us has turned to our own way;</b> and the LORD has laid on him the iniquity of us all.','red')}
${V('Isaiah 59:2','But your iniquities <b>have separated you from your God;</b> your sins have hidden his face from you, so that he will not hear.','red')}
${Q('I try to be a good person. Am I still a sinner?','Sin in the Bible is not about how big a crime is, but about <b>direction</b>. Even if I live a good life, if I am the master and go "my own way" without God, my relationship with him is broken. In archery, missing by 1 cm or by 1 m is still missing the target. The Bible\'s word for sin carries exactly this meaning: "missing the mark."')}
${N('· Ask whether "all" in Romans 3:23 includes them: "Does this include you? It includes me too."<br>· Speak in the tone of "I was like that too," not condemnation.')}`},
death:{t:'The Result of Sin',cap:'The wages of sin is death, then judgment',html:`
<div class="stepNo">3 · THE RESULT</div>
<h2>The result of sin is<br>death and judgment</h2>
<p class="solo">The Bible says the wages of sin is <b>death</b> — not only physical death, but eternal separation from God, the source of life.</p>
${V('Romans 6:23a','For <b>the wages of sin is death</b>','red')}
${V('Hebrews 9:27','Just as people are destined to die once, and <b>after that to face judgment</b>','red')}
${Q('If God is love, why does he judge?','Love and justice are not opposites. A judge who simply ignores wrongdoing is not a good judge. Because God is holy, he judges sin; and because he is love, he prepared a way for that judgment to be taken by someone else. That is what comes next.')}
${N('· Ask: "What are wages?" → what you earn for your work.<br>· State the facts calmly rather than trying to frighten.<br>· "How do people try to cross this gap?" → Next')}`},
effort:{t:'Our Limits',cap:'No effort can reach God',html:`
<div class="stepNo">4 · OUR LIMITS</div>
<h2>We cannot cross by<br>our own efforts</h2>
<p>People build many bridges to try to cross this gap. Tap a button and <b>try it yourself.</b></p>
<div class="btns">
 <button class="btn ghost" onclick="tryPlank(this,'Good works',90)">🤲 Good works</button>
 <button class="btn ghost" onclick="tryPlank(this,'Religion',74)">🙏 Religion</button>
 <button class="btn ghost" onclick="tryPlank(this,'Morality',80)">⚖️ Morality</button>
 <button class="btn ghost" onclick="tryPlank(this,'Philosophy',86)">📚 Philosophy</button>
 <button class="btn ghost" onclick="tryPlank(this,'Success',70)">💰 Success</button>
</div>
<div id="effortMsg"></div>
${Q('Does this mean living a good life is meaningless?','No. Doing good is valuable, and God is pleased with it. It simply means we cannot <b>buy salvation</b> with good works. The order is reversed: we do not reach God by doing good; rather, those saved by God\'s grace live out good works in gratitude (Ephesians 2:10).')}
${N('· Let the listener tap the buttons. Each time one falls: "Will this work?"<br>· Ask: "What have you relied on to cross this gap?"<br>· Be sure to cover the question above so that good works are not seen as bad.')}`},
cross:{t:'The Cross of Jesus',cap:'God opened the way first',html:`
<div class="stepNo">5 · THE CROSS</div>
<h2>God himself opened<br>the way of salvation</h2>
<p class="solo">Because we could not go to God, <b>God came to us.</b> Jesus took the penalty for our sin in our place and died on the cross.</p>
<div class="btns"><button class="btn small ghost" onclick="replayCross()">▶ Replay</button></div>
${V('Romans 5:8','But God demonstrates his own love for us in this: <b>While we were still sinners,</b> Christ died for us.','green')}
${V('1 Peter 3:18','For Christ also suffered once for sins, <b>the righteous for the unrighteous,</b> to bring you to God.','green')}
${Q('Why did Jesus have to die?','Because the wages of sin is death, someone had to pay that price. Only Jesus, who had no sin, could carry the sins of others. The cross is where God\'s justice (sin must be paid for) and his love (God pays it himself) are shown together.')}
${N('· Emphasize "in our place": Jesus received the death I deserved.<br>· Romans 5:8 — not after we became good, but "while we were still sinners".')}`},
risen:{t:'The Risen Jesus',cap:'Jesus rose again',html:`
<div class="stepNo">6 · THE RESURRECTION</div>
<h2>Jesus died,<br>and he rose again</h2>
<p class="solo">The story does not end at the cross. On the third day Jesus <b>rose from the dead.</b> The gospel is not just a call to remember a past sacrifice — it is an invitation to <b>trust the living Jesus</b> and begin a new life.</p>
<div class="btns"><button class="btn small ghost" onclick="replayRise()">▶ Replay</button></div>
${V('1 Corinthians 15:3-4','that Christ <b>died for our sins</b> according to the Scriptures, that he was buried, that he was <b>raised on the third day</b> according to the Scriptures','green')}
${V('John 14:6','Jesus answered, "<b>I am the way</b> and the truth and the life. No one comes to the Father except through me."','green')}
${Q('Why is the resurrection so important?','The resurrection is God\'s proof that the cross truly defeated sin and death. It also means the one we believe in is not a figure in a monument, but someone alive today who can have a relationship with me. So faith becomes more than "accepting a fact" — it is "trusting a living person".')}
${N('· The bridge did not collapse — the resurrection holds it firm forever.<br>· 1 Cor 15:3-4 is what Paul called the gospel he passed on "as of first importance".')}`},
gift:{t:'The Gift of God',cap:'Eternal life is God\'s free gift',html:`
<div class="stepNo">7 · THE GIFT</div>
<h2>Salvation is not a reward,<br>but a gift</h2>
<p class="solo">A gift is not earned by work; it is <b>received freely.</b> Open the gift box in the picture.</p>
<div class="btns"><button class="btn gold" onclick="openGift()">🎁 Open the gift</button></div>
${V('Romans 6:23','For the wages of sin is death, but <b>the gift of God</b> is <b>eternal life</b> in Christ Jesus our Lord.','green')}
<div class="cmp"><div class="a"><strong>Wages of sin</strong>what I earned<br>→ what I deserve<br>→ <b>death</b></div><div class="b"><strong>Gift of God</strong>given freely<br>→ simply receive it<br>→ <b>eternal life</b></div></div>
<div class="bubble"><b>What is eternal life?</b> It is not just living forever. It is <b>a life of knowing God and living with him</b> — a relationship that begins now and continues beyond death.</div>
${V('John 17:3','<b>Now this is eternal life:</b> that they <b>know</b> you, the only true God, and Jesus Christ, whom you have sent.','green')}
${V('Ephesians 2:8-9','For it is by grace you have been saved, through faith — and this is not from yourselves, <b>it is the gift of God</b> — not by works, so that no one can boast.','green')}
${Q('If it is free, isn\'t that too easy?','It is free to the one who receives it, but God paid the highest price — the life of his Son. He gives it as a gift not because it is cheap, but because we could never repay it.')}
${N('· Hold out a pen and say "This is a gift for you." How do you get it? → Just reach out and take it. If you pay, it is no longer a gift.<br>· One-verse method (Romans 6:23): ask what they think of the words "sin", "gift" and "eternal life".')}`},
story:{t:'My Story',cap:'I too met Jesus through this picture',html:`
<div class="stepNo">THE SHARER'S STORY</div>
<h2>I too heard this message<br>and came to believe in Jesus</h2>
<div id="testi"></div>
${N('· With the ✏️ button you can put in your own testimony: ① how you used to think about God ② what you understood through the bridge ③ what believing in Jesus means to you now.<br>· Avoid giving the impression that one must feel exactly as you did.')}`},
respond:{t:'My Response',cap:'Which side are you on now?',html:`
<div class="stepNo">8 · MY RESPONSE</div>
<h2>The bridge is in place.<br>Now it is time to cross</h2>
<p class="solo">Believing in Jesus can be described like this:</p>
<div class="cmp"><div class="a" style="background:#f3ece0"><strong>🔄 Repent</strong>turn from the way where I was my own master</div><div class="b"><strong>🤝 Believe</strong>entrust myself to the living Jesus</div></div>
${V('John 1:12','Yet <b>to all who did receive him,</b> to those who believed in his name, he gave <b>the right to become children of God</b>','green')}
${V('Revelation 3:20','Here I am! <b>I stand at the door and knock.</b> If anyone hears my voice and <b>opens the door,</b> I will come in and eat with that person, and they with me.','green')}
${Q('Does believing mean agreeing that it is true?','It starts with agreeing, but does not stop there. Knowing a chair is strong will not let you rest; you have to actually sit down and put your weight on it. Faith is <b>entrusting myself</b> to the fact that Jesus died and rose again for me.')}
<div class="bubble">Where are you in the picture right now? Choose what is closest to your heart.</div>
<div class="btns" style="flex-direction:column">
 <button class="btn gold" onclick="go(idx('pray'),1)">🙏 I want to pray to God</button>
 <button class="btn ghost" onclick="moreFaith()">📖 I want to know more about believing in Jesus</button>
 <button class="btn ghost" onclick="go(idx('faq'),1)">❓ I still have questions</button>
 <button class="btn ghost" onclick="pause()">🌙 That's enough for today</button>
 <button class="btn ghost" style="border-style:dashed" onclick="go(idx('assure'),1)">😊 I already believe in Jesus</button>
</div>
<div id="whereBox"></div>
${N('· Point to the person in the picture and ask. Do not pressure; wait. Silence is okay.<br>· Respect any choice, and arrange to meet again or exchange contacts.')}`},
pray:{t:'Prayer',cap:'Crossing the bridge by faith',html:`
<div class="stepNo">9 · PRAYER</div>
<h2>Tell God<br>what is in your heart</h2>
<p style="font-size:.88em;color:var(--sub)">Reading these words is not in itself what saves you. What matters is coming to God honestly, trusting in Jesus. The prayer below is an <b>example</b> to help you express your heart.</p>
<div class="prayer">God,<br>I am a sinner who has left you and lived my own way. Please forgive me.<br>I believe that Jesus died on the cross for my sins and rose again.<br>Now I turn from my own way and <b>receive Jesus as my Savior and Lord.</b><br>Thank you for the gift of eternal life.<br>In Jesus' name I pray. <b>Amen.</b></div>
<div class="btns"><button class="btn gold" id="amenBtn" onclick="amen()">🙏 I sincerely prayed this prayer</button></div>
<div id="amenBox"></div>
${Q('If I repent, do I have to become perfect?','No. Repentance is not a promise to become perfect; it is <b>a change of direction.</b> We will still stumble, but God\'s children come back to him, are forgiven, and keep growing (1 John 1:9).')}
${N('· It helps to read each line first and let them repeat it.<br>· After praying, move straight to the assurance verses — based on God\'s promise, not feelings.')}`},
assure:{t:'Assurance',cap:'Crossed over from death to life',html:`
<div class="stepNo">10 · ASSURANCE</div>
<h2>Eternal life is<br>already mine</h2>
<p>Tap the blanks to see God's promise.</p>
<div class="verse green"><div class="ref">John 5:24</div><div class="tx">Very truly I tell you, whoever hears my word and believes him who sent me ${B('has eternal life')} and ${B('will not be judged')} but ${B('has crossed over')} from death to life.</div></div>
<div id="blankMsg"></div>
${V('1 John 5:11-13','And this is the testimony: God has given us eternal life, and this life is in his Son. <b>Whoever has the Son has life;</b> whoever does not have the Son of God does not have life. I write these things to you who believe in the name of the Son of God <b>so that you may know that you have eternal life.</b>','green')}
<p class="solo" style="font-size:.9em;color:var(--sub)">Assurance stands not on feelings but on <b>God's word.</b></p>
${TRAIN('Fact',"God's word",'Faith','trusting the word','Feeling','follows along')}
${Q('Is it okay if I am not yet sure?','Yes. Assurance does not come all at once; it grows as you read God\'s word. If you still have questions, ask any time, and read one chapter of John each day. God meets those who honestly seek him.')}
${N('· Note the tense: not "will have" but "has eternal life", "has crossed over" — already done.<br>· Train illustration: the engine (fact) pulls, the coal car (faith) fuels, the caboose (feeling) follows.')}`},
next:{t:'Next Steps',cap:'A new life begins on God\'s side',html:`
<div class="stepNo">11 · NEXT STEPS</div>
<h2>How new life grows</h2>
<p class="solo">Just as a newborn baby eats, breathes and grows up in a family, a Christian grows in <b>four ways.</b></p>
${WHEEL('Word','Prayer','Fellowship','Witness','Christ','the center','The obedient Christian')}
<p style="font-size:.9em">📖 <b>Word</b> — read one chapter of John each day<br>🙏 <b>Prayer</b> — talk to God about anything<br>🤝 <b>Fellowship</b> — with the one who shared this, and a church<br>📣 <b>Witness</b> — pass the gift on to others</p>
${BDAY('🎂 My spiritual birthday','Name','Make my birthday card')}
${N('· The Wheel: power comes from the hub (Christ). The vertical spokes (Word, Prayer) relate to God; the horizontal (Fellowship, Witness) to people.<br>· Arrange to meet within a week and begin follow-up by reading John together.')}`},
summary:{t:'Summary',cap:'The Gift of God — The Bridge to Life',html:`
<div class="stepNo">SUMMARY</div>
<h2>The gospel at a glance</h2>
<div class="verse"><div class="tx" style="font-size:.95em;line-height:1.9">
① <b>God's purpose</b> — John 3:16; 10:10<br>② <b>Our problem: sin</b> — Rom 3:23; Isa 53:6; 59:2<br>③ <b>The result</b> — Rom 6:23a; Heb 9:27<br>④ <b>Our limits</b> — Eph 2:8-9<br>⑤ <b>The cross</b> — Rom 5:8; 1 Pet 3:18<br>⑥ <b>The resurrection</b> — 1 Cor 15:3-4; John 14:6<br>⑦ <b>The gift of eternal life</b> — Rom 6:23; John 17:3<br>⑧ <b>My response</b> — John 1:12; Rev 3:20<br>⑨ <b>Assurance</b> — John 5:24; 1 John 5:11-13</div></div>
<div class="btns"><button class="btn" onclick="go(0)">Start again</button><button class="btn ghost" onclick="share()">🔗 Share this app</button></div>
<p style="font-size:.75em;color:#999">Scripture quotations taken from The Holy Bible, New International Version® NIV®. Copyright © 1973, 1978, 1984, 2011 by Biblica, Inc.™ Used by permission. All rights reserved worldwide.</p>
${N('· Draw the picture on paper as you explain it again, and give the paper as a gift.<br>· Check understanding: "What did it say our problem is?" "What did Jesus do?" "What does believing mean?" "Which words were unclear?"')}`},
faq:{t:'Questions',cap:'Ask anything, any time',html:`

<h2>Do you still have questions?</h2>

}),

zh:()=>({
start:{t:'开始',cap:'',html:`
<div class="stepNo">神的恩赐</div>
<h2>在神和我之间，<br>耶稣开了一条怎样的路？</h2>
<p>用<b>图画和简短的说明</b>来认识基督信仰的核心信息。大约需要10分钟，随时可以停下来提问。</p>
<div class="btns" style="flex-direction:column">
 <button class="btn" onclick="setMode('together',true)">👥 一起看<br><span style="font-weight:400;font-size:.8em">和分享的人一起边看边谈</span></button>
 <button class="btn ghost" onclick="setMode('alone',true)">🙋 自己看<br><span style="font-weight:400;font-size:.8em">自己慢慢阅读和聆听</span></button>
</div>${LANGBTNS}
${N('· "一起看"会减少文字、放大图画。这些笔记（📝）只给传讲者看。<br>· 开启谈话的问题："如果今晚你的生命结束了，你确定能上天堂吗？""根据是什么？"<br>· 先征求同意："我可以用一幅简单的图，给你看看圣经怎样回答这个问题吗？"')}`},
love:{t:'神的心意',cap:'起初，神与人同在',html:`
<div class="stepNo">1 · 神的心意</div>
<h2>神爱我们，<br>造我们与他同住</h2>
<p class="solo">圣经说，神照着自己的形像造人，愿意与人有<b>亲密的关系</b>。就像图画所示，起初神与人之间没有任何隔阂。</p>
<p class="solo">那么，为什么我们觉得神很遥远，又彼此伤害地活着呢？</p>
${V('约翰福音 3:16','<b>神爱世人，</b>甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，<b>反得永生。</b>')}
${V('约翰福音 10:10','我来了，是要叫羊得生命，并且<b>得的更丰盛。</b>')}
${Q('我不确定神是否真的存在。','没关系。这个应用不会强迫你相信。请先听完圣经怎样讲论神和人，然后自己判断。随时欢迎提问。')}
${N('· 请对方把约3:16的"世人"换成自己的名字读一遍。<br>· 问："听到神爱你，你心里有什么感受？"<br>· 那为什么很多人享受不到这份爱呢？→ 下一步')}`},
sin:{t:'人的问题——罪',cap:'罪使人与神隔绝',html:`
<div class="stepNo">2 · 人的问题</div>
<h2>罪使人与神<br>隔绝了</h2>
<p class="solo">圣经中的罪不只是坏行为，也包括<b>不信靠神、离开神、自己作生命的主人</b>的心，以及由此而来的行为。</p>
<div class="btns"><button class="btn small ghost" onclick="replayCrack()">▶ 重新播放</button></div>
${V('罗马书 3:23','因为<b>世人都犯了罪，</b>亏缺了神的荣耀；','red')}
${V('以赛亚书 53:6','我们都如羊走迷，<b>各人偏行己路；</b>耶和华使我们众人的罪孽都归在他身上。','red')}
${V('以赛亚书 59:2','但你们的罪孽<b>使你们与神隔绝；</b>你们的罪恶使他掩面不听你们。','red')}
${Q('我一直努力做好人，难道也是罪人吗？','圣经说的罪不在于罪行的大小，而在于<b>方向</b>。即使行善，若离开神、自己作主、"偏行己路"，与神的关系仍然是断绝的。射箭时偏一厘米或偏一米，都是没有射中靶心。圣经中"罪"这个词，正有"射不中靶心"的意思。')}
${N('· 问对方罗3:23的"世人"是否包括自己："这里也包括你吗？也包括我。"<br>· 用"我也曾经是这样"的语气，而不是定罪的语气。')}`},
death:{t:'罪的结果',cap:'罪的工价乃是死，死后且有审判',html:`
<div class="stepNo">3 · 罪的结果</div>
<h2>罪的结果是<br>死亡和审判</h2>
<p class="solo">圣经说罪的工价乃是<b>死</b>——不只是肉体的死亡，更是与生命的源头——神——永远隔绝。</p>
${V('罗马书 6:23（上）','因为<b>罪的工价乃是死；</b>','red')}
${V('希伯来书 9:27','按着定命，人人都有一死，<b>死后且有审判。</b>','red')}
${Q('神既然是爱，为什么还要审判？','爱与公义并不矛盾。对不义视而不见的法官不是好法官。神是圣洁的，所以必审判罪；神又是爱，所以预备了一条路，让别人代替我们受这审判。接下来就要讲这件事。')}
${N('· 问："工价是什么？"→ 做工所得的报酬。<br>· 平静地讲述事实，不要用恐吓的方式。<br>· "人们想用什么方法跨越这道鸿沟呢？"→ 下一步')}`},
effort:{t:'人的极限',cap:'任何努力都到不了神那里',html:`
<div class="stepNo">4 · 人的极限</div>
<h2>靠自己的努力<br>无法跨越</h2>
<p>人们想用各种各样的桥来跨越这道鸿沟。请点按钮，<b>亲自试一试。</b></p>
<div class="btns">
 <button class="btn ghost" onclick="tryPlank(this,'善行',70)">🤲 善行</button>
 <button class="btn ghost" onclick="tryPlank(this,'宗教',62)">🙏 宗教</button>
 <button class="btn ghost" onclick="tryPlank(this,'道德',66)">⚖️ 道德</button>
 <button class="btn ghost" onclick="tryPlank(this,'哲学',58)">📚 哲学</button>
 <button class="btn ghost" onclick="tryPlank(this,'成功',54)">💰 成功</button>
</div>
<div id="effortMsg"></div>
${Q('那么行善就没有意义了吗？','不是的。行善是宝贵的，神也喜悦。只是我们不能用行善来<b>换取救恩</b>。顺序正好相反：不是靠行善到神那里，而是蒙神恩典得救的人，带着感恩的心去行善（以弗所书 2:10）。')}
${N('· 让对方亲自点按钮。每次桥掉下去时问："这样可以吗？"<br>· 问："你一直想靠什么来跨越这道鸿沟？"<br>· 一定要讲上面的问题，免得对方以为行善是不好的。')}`},
cross:{t:'耶稣的十字架',cap:'神先为我们开了路',html:`
<div class="stepNo">5 · 十字架</div>
<h2>神亲自开了<br>救恩之路</h2>
<p class="solo">人无法到神那里去，所以<b>神亲自来到人中间。</b>耶稣替我们承担了罪的刑罚，死在十字架上。</p>
<div class="btns"><button class="btn small ghost" onclick="replayCross()">▶ 重新播放</button></div>
${V('罗马书 5:8','惟有基督<b>在我们还作罪人的时候</b>为我们死，神的爱就在此向我们显明了。','green')}
${V('彼得前书 3:18','因基督也曾一次为罪受苦，<b>就是义的代替不义的，</b>为要引我们到神面前。','green')}
${Q('耶稣为什么必须死？','罪的工价乃是死，所以必须有人付这个代价。只有无罪的耶稣能够替别人担当罪。十字架同时彰显了神的公义（罪必须付上代价）和神的爱（神亲自付了这代价）。')}
${N('· 强调"代替"：我该受的死，耶稣替我受了。<br>· 罗5:8——不是在我们变好以后，而是"在我们还作罪人的时候"。')}`},
risen:{t:'复活的耶稣',cap:'耶稣复活了',html:`
<div class="stepNo">6 · 复活</div>
<h2>耶稣死了，<br>又复活了</h2>
<p class="solo">故事并没有在十字架结束。耶稣第三天<b>从死里复活了。</b>福音不只是叫我们记念过去的牺牲，更是邀请我们<b>信靠今天活着的耶稣</b>，开始新的生命。</p>
<div class="btns"><button class="btn small ghost" onclick="replayRise()">▶ 重新播放</button></div>
${V('哥林多前书 15:3-4','就是基督照圣经所说，<b>为我们的罪死了，</b>而且埋葬了；又照圣经所说，<b>第三天复活了</b>','green')}
${V('约翰福音 14:6','耶稣说："<b>我就是道路、</b>真理、生命；若不藉着我，没有人能到父那里去。"','green')}
${Q('复活为什么这么重要？','复活是神的证明：十字架真的胜过了罪和死亡。这也表示我们所信的不是纪念碑里的人物，而是今天活着、能与我建立关系的那一位。所以信心不只是"承认事实"，而是"信靠一位活着的主"。')}
${N('· 桥没有塌——复活使这座桥永远坚固。<br>· 林前15:3-4是保罗说"最要紧的"福音摘要。')}`},
gift:{t:'神的恩赐',cap:'永生是神白白的恩赐',html:`
<div class="stepNo">7 · 神的恩赐</div>
<h2>救恩不是报酬，<br>而是礼物</h2>
<p class="solo">礼物不是靠工作赚来的，而是<b>白白领受的。</b>请打开图画里的礼物盒。</p>
<div class="btns"><button class="btn gold" onclick="openGift()">🎁 打开礼物</button></div>
${V('罗马书 6:23','因为罪的工价乃是死；<b>惟有神的恩赐，</b>在我们的主基督耶稣里，<b>乃是永生。</b>','green')}
<div class="cmp"><div class="a"><strong>罪的工价</strong>我做工的报酬<br>→ 应得的<br>→ <b>死</b></div><div class="b"><strong>神的恩赐</strong>白白赐给的礼物<br>→ 只要领受<br>→ <b>永生</b></div></div>
<div class="bubble"><b>什么是永生？</b>不只是永远活着，而是<b>认识神、与神同住的生命</b>——从现在开始，一直延续到死亡以后的关系。</div>
${V('约翰福音 17:3','<b>认识</b>你独一的真神，并且认识你所差来的耶稣基督，<b>这就是永生。</b>','green')}
${V('以弗所书 2:8-9','你们得救是本乎恩，也因着信；这并不是出于自己，<b>乃是神所赐的；</b>也不是出于行为，免得有人自夸。','green')}
${Q('白白得来，不是太容易了吗？','对领受的人是白白的，但赐下的神付上了最高的代价——他儿子的生命。不是因为便宜，而是因为我们永远还不起，所以神当作礼物赐给我们。')}
${N('· 拿出一支笔说："这是送你的礼物。"怎样得到？→ 伸手接过来就可以。如果付钱，就不再是礼物了。<br>· 一节经文传福音（罗6:23）：问对方怎样理解"罪""恩赐""永生"。')}`},
story:{t:'我的故事',cap:'我也是借着这幅图认识了耶稣',html:`
<div class="stepNo">传讲者的故事</div>
<h2>我也是听了这个信息<br>而信了耶稣</h2>
<div id="testi"></div>
${N('· 传讲者可以用 ✏️ 按钮放入自己的见证：① 以前怎样看神 ② 借着"桥"明白了什么 ③ 信耶稣现在对我意味着什么。<br>· 不要给人"必须和我感受一样才算信"的印象。')}`},
respond:{t:'我的回应',cap:'你现在在哪一边？',html:`
<div class="stepNo">8 · 我的回应</div>
<h2>桥已经架好了，<br>现在就差走过去</h2>
<p class="solo">信耶稣可以这样说明：</p>
<div class="cmp"><div class="a" style="background:#f3ece0"><strong>🔄 悔改</strong>从自己作主的路上回转</div><div class="b"><strong>🤝 相信</strong>把自己交托给活着的耶稣</div></div>
${V('约翰福音 1:12','<b>凡接待他的，</b>就是信他名的人，他就<b>赐他们权柄作神的儿女。</b>','green')}
${V('启示录 3:20','看哪，<b>我站在门外叩门，</b>若有听见我声音就<b>开门的，</b>我要进到他那里去，我与他，他与我一同坐席。','green')}
${Q('相信就是承认这是事实吗？','从承认开始，但不止于此。知道椅子很结实并不能让你休息，你必须真的坐下，把身体交给它。信心就是把<b>我自己交托</b>在"耶稣为我死而复活"这个事实上。')}
<div class="bubble">在这幅图里，你现在在哪里？请选择最接近你心意的一项。</div>
<div class="btns" style="flex-direction:column">
 <button class="btn gold" onclick="go(idx('pray'),1)">🙏 我想向神祷告</button>
 <button class="btn ghost" onclick="moreFaith()">📖 我想多了解信耶稣是什么意思</button>
 <button class="btn ghost" onclick="go(idx('faq'),1)">❓ 我还有问题</button>
 <button class="btn ghost" onclick="pause()">🌙 今天就看到这里</button>
 <button class="btn ghost" style="border-style:dashed" onclick="go(idx('assure'),1)">😊 我已经信耶稣了</button>
</div>
<div id="whereBox"></div>
${N('· 指着图中的人问对方。不要强迫，耐心等待，沉默也没关系。<br>· 尊重任何选择，约好再见面或留下联系方式。')}`},
pray:{t:'祷告',cap:'凭信心走过这座桥',html:`
<div class="stepNo">9 · 祷告</div>
<h2>把你的心意<br>告诉神</h2>
<p style="font-size:.88em;color:var(--sub)">照着念这些句子本身并不能使人得救。重要的是信靠耶稣、真诚地来到神面前。下面的祷告只是帮助你表达心意的<b>例子</b>。</p>
<div class="prayer">神啊，<br>我是离开你、按自己意思生活的罪人，求你赦免我。<br>我相信耶稣为我的罪死在十字架上，又复活了。<br>现在我从自己的路上回转，<b>接待耶稣作我的救主和主。</b><br>感谢你把永生当作礼物赐给我。<br>奉耶稣的名祷告，<b>阿们。</b></div>
<div class="btns"><button class="btn gold" id="amenBtn" onclick="amen()">🙏 我真心作了这个祷告</button></div>
<div id="amenBox"></div>
${Q('悔改了，就必须成为完美的人吗？','不是的。悔改不是承诺变得完美，而是<b>转变方向</b>。我们仍会跌倒，但神的儿女会回到神面前，蒙赦免，继续成长（约翰一书 1:9）。')}
${N('· 可以由传讲者先读一句，再请对方跟着祷告。<br>· 祷告后立刻进入得救确据的经文——根据神的应许，而不是感觉。')}`},
assure:{t:'得救的确据',cap:'已经出死入生了',html:`
<div class="stepNo">10 · 确据</div>
<h2>永生现在<br>已经是我的了</h2>
<p>点空格，看看神的应许。</p>
<div class="verse green"><div class="ref">约翰福音 5:24</div><div class="tx">我实实在在地告诉你们，那听我话、又信差我来者的，就${B('有永生')}；${B('不至于定罪')}，是已经${B('出死入生')}了。</div></div>
<div id="blankMsg"></div>
${V('约翰一书 5:11-13','这见证就是神赐给我们永生，这永生也是在他儿子里面。<b>人有了神的儿子就有生命；</b>没有神的儿子就没有生命。我将这些话写给你们信奉神儿子之名的人，<b>要叫你们知道自己有永生。</b>','green')}
<p class="solo" style="font-size:.9em;color:var(--sub)">确据不是建立在感觉上，而是建立在<b>神的话语</b>上。</p>
${TRAIN('事实','神的话语','信心','信靠神的话','感觉','随后跟来')}
${Q('如果我还没有确据，可以吗？','可以。确据不是一夜之间完成的，而是在读神的话语中成长。若还有问题，随时可以问，也请每天读一章《约翰福音》。神必与诚心寻求他的人相遇。')}
${N('· 注意时态："就有永生""已经出死入生"——这是已经成就的事实。<br>· 火车比喻：火车头（事实）拉动，煤车（信心）供给，车厢（感觉）跟随。')}`},
next:{t:'下一步',cap:'在神这一边开始的新生命',html:`
<div class="stepNo">11 · 下一步</div>
<h2>新生命如何成长</h2>
<p class="solo">就像新生的婴儿要吃、要呼吸、在家中长大，基督徒也借着<b>四件事</b>成长。</p>
${WHEEL('神的话','祷告','团契','见证','基督','中心','顺服的基督徒生活')}
<p style="font-size:.9em">📖 <b>神的话</b>——每天读一章《约翰福音》<br>🙏 <b>祷告</b>——什么事都可以告诉神<br>🤝 <b>团契</b>——与传福音给你的人、与教会一起<br>📣 <b>见证</b>——把领受的礼物分享给别人</p>
${BDAY('🎂 我的属灵生日','名字','制作属灵生日卡')}
${N('· 车轮比喻：力量来自中心（基督）。竖的轮辐（神的话、祷告）是与神的关系，横的轮辐（团契、见证）是与人的关系。<br>· 一周内约好再见面，从一起读《约翰福音》开始跟进。')}`},
summary:{t:'总结',cap:'神的恩赐 永生——生命之桥',html:`
<div class="stepNo">总结</div>
<h2>一眼看懂福音</h2>
<div class="verse"><div class="tx" style="font-size:.95em;line-height:1.9">
① <b>神的心意</b>——约3:16；10:10<br>② <b>人的问题：罪</b>——罗3:23；赛53:6；59:2<br>③ <b>罪的结果</b>——罗6:23上；来9:27<br>④ <b>人的极限</b>——弗2:8-9<br>⑤ <b>十字架</b>——罗5:8；彼前3:18<br>⑥ <b>复活</b>——林前15:3-4；约14:6<br>⑦ <b>永生的恩赐</b>——罗6:23；约17:3<br>⑧ <b>我的回应</b>——约1:12；启3:20<br>⑨ <b>确据</b>——约5:24；约壹5:11-13</div></div>

${N('· 一边在纸上画这幅图一边再讲一遍，并把这张纸送给对方。<br>· 确认理解："人的问题是什么？""耶稣做了什么？""相信是什么意思？""哪里不明白？"')}`},
faq:{t:'常见问题',cap:'随时都可以提问',html:`

})
};


const idx=id=>steps.findIndex(s=>s.id===id);
function buildSteps(){ const C=CONTENT[st.lang](); steps=META.map(m=>({...m,...C[m.id]})); }

function setLang(l,keep){
  st.lang=l; save(); L=UI[l]; document.documentElement.lang=l==='zh'?'zh-CN':l;
  document.body.dataset.lang=l;
  $('#hTitle').textContent=L.title; $('#hSub').textContent=L.sub; $('#prev').textContent=L.prev; $('#tocH').textContent=L.toc; $('#tocHelp').innerHTML=L.tocHelp; $('#fsLbl').textContent=L.fs;
  const T={tMan:L.man,tGod:L.god,tSin:L.sin,tDeath:L.death,tJudg:L.judg,tJesus:L.jesus,tRisen:L.risen,lifeTxt:L.life};
  for(const k in T) $('#'+k).textContent=T[k];
  document.title=L.shareT;
  buildSteps();
  $('#dots').innerHTML=steps.map(()=>'<i></i>').join('');
  $('#tocList').innerHTML=steps.map((s,i)=>`<button onclick="go(${i});toc(false)">${i===0?'·':i}  ${s.t}</button>`).join('');
  [...document.querySelectorAll('#langPop button')].forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  $('#langPop').classList.remove('open');
  go(keep?cur:cur,0);
}

function setStage(cls){ stage.className=cls; $('#fillerG').style.setProperty('--fg',cls.includes('joined')?1:0); }
function go(i,dir){
  if(i<0||i>=steps.length)return;
  const prevCrossed=personX>200;
  cur=i; const s=steps[i];
  speakStop();
  setStage(s.stage);
  $('#stageCap').textContent=s.cap;
  panel.innerHTML=s.html; panel.scrollTop=0; panel.classList.remove('fade'); void panel.offsetWidth; panel.classList.add('fade');
  [...$('#dots').children].forEach((d,k)=>d.classList.toggle('on',k===i));
  [...$('#tocList').children].forEach((d,k)=>d.classList.toggle('cur',k===i));
  $('#prev').disabled=i===0; $('#prev').style.opacity=i===0?.4:1;
  $('#next').textContent=i===steps.length-1?L.restart:L.next;
  const shouldCross=s.stage.includes('crossed')||(s.id==='pray'&&prayed);
  if(!shouldCross&&prevCrossed) walkTo(85,500);
  if(s.enter) s.enter(dir);
  if(s.id==='pray'&&prayed){$('#amenBtn').disabled=true;$('#amenBox').innerHTML=`<div class="card">${L.welcome}</div>`}
  st.cur=i; save();
}
$('#next').onclick=()=>go(cur===steps.length-1?0:cur+1,1);
$('#prev').onclick=()=>go(cur-1,-1);

/* swipe */
let sx=0,sy=0,stt=0;
panel.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;stt=Date.now()},{passive:true});
panel.addEventListener('touchend',e=>{ if(e.target.closest('input,textarea'))return; const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8&&Date.now()-stt<700){ dx<0?$('#next').click():(cur>0&&go(cur-1,-1)); }},{passive:true});

/* ---------- animations ---------- */
function crack(dir){
  if(dir===-1)return;
  setStage('joined');
  setTimeout(()=>{ setStage('split night boltOn'); $('#svg').classList.add('shake');
    setTimeout(()=>{$('#svg').classList.remove('shake');stage.classList.remove('boltOn')},1100);},400);
}
function replayCrack(){ setStage('joined'); setTimeout(()=>crack(1),900); }
function dropCross(dir){ if(dir===-1)return; setStage('split deep night'); setTimeout(()=>setStage(steps[idx('cross')].stage),400); }
function replayCross(){ setStage('split deep night'); setTimeout(()=>setStage(steps[idx('cross')].stage),700); }
function replayRise(){ setStage(steps[idx('cross')].stage); setTimeout(()=>setStage(steps[idx('risen')].stage),600); }
function openGift(){ stage.classList.add('giftOpen'); toast(L.giftT); }

let tried=new Set();
function tryPlank(btn,label,len){
  const g=$('#planks'); const id='pk'+Date.now();
  g.insertAdjacentHTML('beforeend',`<g id="${id}" class="plank go"><rect x="150" y="145" width="${len}" height="9" rx="2" fill="#c9b48a" stroke="#8a7550"/><text x="${150+len/2}" y="138" text-anchor="middle" font-size="16" class="lbl" fill="#ffe7a8" stroke="#3a2a10" stroke-width="3" paint-order="stroke">${label}</text></g>`);
  setTimeout(()=>document.getElementById(id)?.remove(),2500);
  btn.style.textDecoration='line-through'; btn.style.opacity=.6;
  tried.add(label);
  const m=$('#effortMsg');
  if(tried.size<3) m.innerHTML=`<div class="bubble fade">${L.eff1(label)}</div>`;
  else m.innerHTML=L.eff3();
}

function walkTo(x,ms=2200,cb){
  const P=$('#P'); const x0=personX, t0=performance.now();
  function f(t){ let k=Math.min(1,(t-t0)/ms); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    personX=x0+(x-x0)*e; const onBeam=personX>140&&personX<262;
    const bob=Math.abs(Math.sin(k*Math.PI*8))*2*(k<1?1:0);
    P.setAttribute('transform',`translate(${personX.toFixed(1)} ${(onBeam?-4:0)-bob})`);
    if(k<1)requestAnimationFrame(f); else cb&&cb(); }
  requestAnimationFrame(f);
}
function setCrossed(on,animate){
  if(on){ if(personX<200){ if(animate) walkTo(295,2400,()=>stage.classList.add('crossed')); else { personX=295; $('#P').setAttribute('transform','translate(295 0)'); } } }
  else if(personX>200) walkTo(85,500);
}
function amen(){
  if(prayed)return; prayed=true; $('#amenBtn').disabled=true;
  stage.classList.remove('crossed');
  walkTo(295,2600,()=>{stage.classList.add('crossed'); $('#amenBox').innerHTML=`<div class="card fade">${L.welcome}</div>`; toast(L.amenT); });
}
function openB(el){ el.classList.add('open'); if(document.querySelectorAll('.blank.open').length===3) $('#blankMsg').innerHTML=`<div class="bubble fade">${L.blanks}</div>`; }
function moreFaith(){ $('#whereBox').innerHTML=`<div class="bubble fade">${L.faith}</div><div class="btns"><button class="btn gold" onclick="go(idx('pray'),1)">${L.wantPray}</button><button class="btn ghost" onclick="go(idx('faq'),1)">${L.haveQ}</button></div>`; $('#whereBox').scrollIntoView({behavior:'smooth',block:'nearest'}); }
function pause(){ $('#whereBox').innerHTML=`<div class="bubble fade">${L.pause}</div><div class="btns"><button class="btn ghost" onclick="go(idx('summary'),1)">${L.again}</button></div>`; $('#whereBox').scrollIntoView({behavior:'smooth',block:'nearest'}); }

/* ---------- testimony (전하는 이가 바꿀 수 있음) ---------- */
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function testiText(){ return (st.testi&&st.testi[st.lang])||TESTI[st.lang]; }
function renderTesti(){
  const box=$('#testi'); if(!box)return;
  const html=esc(testiText()).split(/\n\s*\n/).map(p=>p.replace(/\n/g,'<br>')).join('<br><br>');
  box.innerHTML=`<div class="verse"><div class="tx" style="line-height:1.85">${html}</div></div>
  <div class="btns editOnly"><button class="btn small ghost" onclick="editTesti()">${L.tEdit}</button>${st.testi&&st.testi[st.lang]?`<button class="btn small ghost" onclick="resetTesti()">${L.tReset}</button>`:''}</div>`;
}
function editTesti(){
  $('#testi').innerHTML=`<p style="font-size:.85em;color:var(--sub)">${L.tHelp}</p>
  <textarea id="tArea" class="inp" rows="12" style="line-height:1.6">${esc(testiText())}</textarea>
  <div class="btns"><button class="btn small ghost" onclick="pasteTesti()">${L.tPaste}</button><button class="btn small gold" onclick="saveTesti()">${L.tSave}</button><button class="btn small ghost" onclick="renderTesti()">${L.tCancel}</button></div>`;
}
async function pasteTesti(){
  try{ const t=await navigator.clipboard.readText(); if(t&&t.trim()){ $('#tArea').value=t.trim(); return; } }catch(e){}
  toast(L.tPasteFail); $('#tArea').focus();
}
function saveTesti(){ const t=$('#tArea').value.trim(); st.testi=st.testi||{}; if(t) st.testi[st.lang]=t; else delete st.testi[st.lang]; save(); renderTesti(); toast(L.tSaved); }
function resetTesti(){ if(st.testi) delete st.testi[st.lang]; save(); renderTesti(); toast(L.tResetQ); }

/* ---------- mode / speech ---------- */
function setMode(m,adv){ st.mode=m; st.notes=(m==='together'); save(); applyMode(); toast(m==='together'?L.mT:L.mA); if(adv) go(1,1); }
function applyMode(){ const t=st.mode==='together'; document.body.classList.toggle('together',t); document.body.classList.toggle('showNotes',!!st.notes); $('#noteBtn').classList.toggle('on',!!st.notes); $('#modeBtn').textContent=t?'👥':'🙋'; }
let speaking=false;
function speakStop(){ try{speechSynthesis.cancel()}catch(e){} speaking=false; $('#spkBtn').classList.remove('on'); }
function speak(){ if(!('speechSynthesis' in window)){toast(L.noTTS);return}
  if(speaking){speakStop();return}
  const c=panel.cloneNode(true);
  c.querySelectorAll('.note,details,button,svg,input,textarea,.btns,#cardBox,.langRow').forEach(e=>e.remove());
  if(document.body.classList.contains('together')) c.querySelectorAll('.solo').forEach(e=>e.remove());
  c.querySelectorAll('.ref').forEach(r=>r.textContent=r.textContent+'. ');
  document.body.appendChild(c); c.style.cssText='position:absolute;left:-9999px;width:400px';
  const parts=c.innerText.split(/\n+/).map(t=>spoken(t.trim())).filter(Boolean); c.remove();
  const lang=L.tts, vs=speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(lang.slice(0,2)));
  speaking=true; $('#spkBtn').classList.add('on');
  parts.forEach((t,k)=>{const u=new SpeechSynthesisUtterance(t); u.lang=lang; if(vs[0])u.voice=vs[0]; u.rate=0.95; if(k===parts.length-1)u.onend=()=>speakStop(); speechSynthesis.speak(u);});
}


/* 성경 장·절을 소리 내어 읽기 좋게 바꾸기 */
function sino(n){ n=+n; const d=['','일','이','삼','사','오','육','칠','팔','구']; let r='';
  const h=Math.floor(n/100), t=Math.floor(n%100/10), o=n%10;
  if(h) r+=(h>1?d[h]:'')+'백'; if(t) r+=(t>1?d[t]:'')+'십'; if(o) r+=d[o]; return r||'영'; }
const KO_BOOKS={'롬':'로마서','사':'이사야','요':'요한복음','엡':'에베소서','요일':'요한일서','히':'히브리서','벧전':'베드로전서','고전':'고린도전서','계':'요한계시록','잠':'잠언','창':'창세기','마':'마태복음'};
function spoken(t){
  if(st.lang==='ko'){
    t=t.replace(/(^|[\s(（—])(요일|벧전|고전|롬|사|요|엡|히|계|잠|창|마)\s+(?=\d)/g,(m,a,b)=>a+KO_BOOKS[b]+' ');
    t=t.replace(/(\d+):(\d+)\s*-\s*(\d+)/g,(m,a,b,c)=>`${sino(a)}장 ${sino(b)}절에서 ${sino(c)}절`);
    t=t.replace(/(\d+):(\d+)/g,(m,a,b)=>`${sino(a)}장 ${sino(b)}절`);
    t=t.replace(/(\d+)\s*장/g,(m,a)=>sino(a)+'장').replace(/(\d+)\s*절/g,(m,a)=>sino(a)+'절');
  } else if(st.lang==='zh'){
    t=t.replace(/(\d+):(\d+)\s*-\s*(\d+)/g,'$1章$2节到$3节').replace(/(\d+):(\d+)/g,'$1章$2节');
  } else {
    t=t.replace(/(\d+):(\d+)\s*-\s*(\d+)/g,'chapter $1, verses $2 to $3').replace(/(\d+):(\d+)/g,'chapter $1, verse $2');
  }
  return t;
}
/* ---------- spiritual birthday card ---------- */
function makeCard(){
  const name=($('#bdName').value||'').trim()||L.me, d=$('#bdDate').value||new Date().toISOString().slice(0,10);
  const [y,m,dd]=d.split('-').map(Number);
  const c=document.createElement('canvas'); c.width=1080;c.height=1350; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,1350); g.addColorStop(0,'#14213a'); g.addColorStop(1,'#2c5282'); x.fillStyle=g; x.fillRect(0,0,1080,1350);
  x.fillStyle='#6f5d49'; x.fillRect(0,820,400,530); x.fillRect(680,820,400,530);
  x.fillStyle='#6aa84f'; x.fillRect(0,815,400,14); x.fillRect(680,815,400,14);
  const gl=x.createRadialGradient(540,780,10,540,780,330); gl.addColorStop(0,'rgba(255,242,184,.85)'); gl.addColorStop(1,'rgba(255,242,184,0)'); x.fillStyle=gl; x.fillRect(150,420,780,720);
  x.fillStyle='#a8682f'; x.fillRect(522,600,36,750); x.fillRect(370,800,340,32);
  x.textAlign='center'; const F='Pretendard, "Apple SD Gothic Neo", "PingFang SC", "Noto Sans SC", sans-serif';
  x.fillStyle='#f7d58b'; x.font=`700 54px ${F}`; x.fillText(L.cardT,540,170);
  x.fillStyle='#fff'; x.font=`800 ${st.lang==='en'?76:92}px ${F}`; x.fillText(L.date(y,m,dd),540,300);
  x.font=`700 60px ${F}`; x.fillText(name,540,400);
  x.font=`500 34px ${F}`; x.fillStyle='#e9eef6';
  L.cardV.forEach((t,k)=>x.fillText(t,540,1040+k*56));
  x.fillStyle='#f7d58b'; x.font=`700 32px ${F}`; x.fillText(L.cardR,540,1230);
  const url=c.toDataURL('image/png');
  $('#cardBox').innerHTML=`<img src="${url}" style="width:100%;border-radius:14px;margin-top:8px" alt=""><div class="btns"><a class="btn" style="text-align:center;text-decoration:none;line-height:30px" href="${url}" download="spiritual_birthday.png">${L.save}</a></div><p style="font-size:.8em;color:#888">${L.saveHint}</p>`;
}

function share(){
  const u=location.href.split('#')[0];
  if(navigator.share) navigator.share({title:L.shareT,text:L.shareX,url:u}).catch(()=>{});
  else { navigator.clipboard?.writeText(u); toast(L.copied); }
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function toc(o){$('#toc').classList.toggle('open',o)}
$('#tocBtn').onclick=()=>toc(true);
$('#toc').onclick=e=>{if(e.target.id==='toc')toc(false)};
$('#noteBtn').onclick=()=>{const on=document.body.classList.toggle('showNotes');st.notes=on;save();$('#noteBtn').classList.toggle('on',on);toast(on?L.notesOn:L.notesOff)};
$('#modeBtn').onclick=()=>setMode(st.mode==='together'?'alone':'together');
$('#spkBtn').onclick=speak;
$('#langBtn').onclick=e=>{e.stopPropagation();$('#langPop').classList.toggle('open')};
document.addEventListener('click',e=>{ if(!e.target.closest('#langPop'))$('#langPop').classList.remove('open') });
function fsStep(d){ const sizes=[16,18,20,22,24]; let k=sizes.indexOf(st.fs||18); k=Math.max(0,Math.min(sizes.length-1,k+d)); st.fs=sizes[k]; document.documentElement.style.setProperty('--fs',st.fs+'px'); save(); toast(L.fs+' '+st.fs); }
$('#svg').addEventListener('click',()=>{ const id=steps[cur].id; if(id==='gift')openGift(); else if(id==='sin')replayCrack(); else if(id==='cross')replayCross(); else if(id==='risen')replayRise(); });

/* manifest + offline */
const icon=`data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#14213a"/><rect x="0" y="330" width="190" height="182" fill="#7a6650"/><rect x="322" y="330" width="190" height="182" fill="#7a6650"/><circle cx="256" cy="300" r="150" fill="#fff2b8" opacity=".35"/><rect x="238" y="150" width="36" height="362" fill="#c8843f"/><rect x="150" y="320" width="212" height="30" fill="#c8843f"/></svg>')}`;
$('#mf').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify({name:'하나님의 선물 영생',short_name:'영생의 다리',start_url:location.href.split('#')[0],display:'standalone',background_color:'#14213a',theme_color:'#14213a',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any'}]}));
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

applyMode();
if(!st.lang){ const n=(navigator.language||'ko').toLowerCase(); st.lang=n.startsWith('zh')?'zh':n.startsWith('ko')?'ko':'en'; }
cur=0; setLang(st.lang);
